<meta name="theme-color" content="#FFF5F8">
<script>
  // Modo oscuro: «auto» sigue al móvil; «light»/«dark» fijos (Ajustes › Apariencia)
  (function () {
    var mq = window.matchMedia ? matchMedia('(prefers-color-scheme: dark)') : null;
    window.brisaTema = function () {
      var t = 'auto'; try { t = localStorage.getItem('brisa:tema') || 'auto'; } catch (e) {}
      var dark = t === 'dark' || (t === 'auto' && mq && mq.matches);
      document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
      var m = document.querySelector('meta[name=theme-color]'); if (m) m.setAttribute('content', dark ? '#2B1623' : '#FFF5F8');
    };
    window.brisaTema();
    if (mq && mq.addEventListener) mq.addEventListener('change', window.brisaTema);
  })();
</script>
